<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Sharing Platform - My Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body style="padding: 18px 0px 0px">
    <div class="container">

        <!-- Back Button -->
        <a href="{{ url_for('dashboard') }}" class="back-button">
            <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
        </a>

        <!-- Flash Messages -->
        {% for category, message in get_flashed_messages(with_categories=true) %}
        <div class="flash-message flash-{{ category }}">
            <i class="fas fa-info-circle me-2"></i>{{ message }}
        </div>
        {% endfor %}

        <div class="borrow-container">

            <!-- Header -->
            <div class="borrow-header">
                <h1><i class="fas fa-user-circle me-3"></i>My Profile</h1>
                <p>Update your personal information</p>
            </div>

            <!-- Profile Avatar -->
            <div class="profile-avatar">
                <div class="avatar-circle">
                    <i class="fas fa-user"></i>
                </div>
                <h3 class="avatar-name">{{ user['username'] }}</h3>
                <span class="avatar-role">{{ user['role'] }}</span>
            </div>

            <!-- Form Body -->
            <div class="borrow-body">
                <form action="{{ url_for('profile') }}" method="POST">

                    <!-- Username -->
                    <div class="form-section">
                        <label for="username" class="form-label">
                            <i class="fas fa-user me-2"></i>Username
                        </label>
                        <div class="input-icon">
                            <i class="fas fa-at"></i>
                            <input type="text" class="form-control" id="username" name="username"
                                value="{{ user['username'] }}" required>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="form-section">
                        <label for="email" class="form-label">
                            <i class="fas fa-envelope me-2"></i>Email
                        </label>
                        <div class="input-icon">
                            <i class="fas fa-envelope"></i>
                            <input type="email" class="form-control" id="email" name="email" value="{{ user['email'] }}"
                                required>
                        </div>
                    </div>

                    <div class="section-divider"></div>

                    <!-- New Password -->
                    <div class="form-section">
                        <label for="new_password" class="form-label">
                            <i class="fas fa-lock me-2"></i>New Password
                        </label>
                        <div class="input-icon">
                            <i class="fas fa-key"></i>
                            <input type="password" class="form-control" id="new_password" name="new_password"
                                placeholder="Leave empty to keep current password">
                        </div>
                        <small class="image-hint">Only fill this if you want to change your password</small>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="btn-submit">
                        <i class="fas fa-save me-2"></i>Save Changes
                    </button>

                    <a href="{{ url_for('dashboard') }}" class="btn-cancel">
                        <i class="fas fa-times me-2"></i>Cancel
                    </a>

                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
